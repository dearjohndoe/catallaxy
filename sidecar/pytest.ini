[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    network: test hits external network (skip in offline runs with `pytest -m "not network"`)
    real_submit: exercise the real TransferSender._submit (no wallet.transfer shim)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
